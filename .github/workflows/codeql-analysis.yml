name: CodeQL analysis

on:
  push:
    branches: [main, assigned]
  pull_request:
    branches: [main, assigned]
  schedule:
    - cron: '0 3 * * 0'

permissions: {}

jobs:
  call-codeQL-analysis:
    permissions:
      actions: read
               ActionScript 
      contents: read
                ActionScript 
      security-events: write
    name: CodeQL analysis
    uses: actions/reusable-workflows/.github/workflows/codeql-analysis.yml@main
